name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR checks must never cancel an active main/Pages deployment.
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify pinned Supabase CLI recovery command contract
        run: |
          version="$(npx --yes supabase@2.122.0 --version)"
          test "$version" = "2.122.0"
          npx --yes supabase@2.122.0 db dump --help > /tmp/ays-db-dump-help.txt
          npx --yes supabase@2.122.0 storage cp --help > /tmp/ays-storage-cp-help.txt
          npx --yes supabase@2.122.0 status --help > /tmp/ays-status-help.txt
          for flag in --linked --role-only --data-only --use-copy --file; do
            grep -Fq -- "$flag" /tmp/ays-db-dump-help.txt
          done
          for flag in --linked --local --recursive --experimental; do
            grep -Fq -- "$flag" /tmp/ays-storage-cp-help.txt
          done
          grep -Fq -- '--output' /tmp/ays-status-help.txt
          echo "PASS: pinned Supabase CLI 2.122.0 recovery flags"
      - name: Stage 2 final acceptance - guard complete regression and deployment coverage
        run: node tests/stage2-final-acceptance.mjs
      - name: Stage 3 app boundaries
        run: node --experimental-strip-types tests/stage3-app-boundaries.mjs
      - name: Stage 3 shared sheet infrastructure contract
        run: node tests/stage3-sheet-infrastructure.mjs
      - name: Stage 3 shared rich editor boundaries
        run: node tests/stage3-rich-editor-boundaries.mjs
      - name: Stage 3 rooms and library boundaries
        run: node --experimental-strip-types tests/stage3-rooms-library-boundaries.mjs
      - name: Stage 3 full architecture regression
        run: node tests/stage3-architecture-final.mjs
      - name: Rooms V2 role and lifecycle contract
        run: node --experimental-strip-types tests/stage4-rooms-v2-contract.mjs
      - name: D&D Rooms V2 review-only gate and schema proposal contract
        run: node --experimental-strip-types tests/dnd-rooms-v2-gate.mjs
      - name: Rooms V2 realtime stale responses and reconnect
        run: node tests/stage4-rooms-realtime.mjs
      - name: Rooms V2 master operations and conflict regression
        run: node --experimental-strip-types tests/stage4-rooms-master-actions.mjs
      - name: Rooms V2 player multi-room and resource contract
        run: node tests/stage4-rooms-player-contract.mjs
      - name: Rooms V2 final session isolation and SQL contract
        run: node tests/stage4-rooms-final-acceptance.mjs
      - name: Check data models
        run: npm run test:models
      - name: Validate Supabase browser configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co$ ]]; then
            echo "::error::Set VITE_SUPABASE_URL to the new Supabase project's HTTPS URL."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::Set VITE_SUPABASE_PUBLISHABLE_KEY to the project's publishable key (not a secret key)."
            exit 1
          fi
          echo "Public Supabase configuration is present."
      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - name: Verify Rooms release JSON and HTML match commit
        run: node tests/stage4-rooms-release-artifact.mjs
      - name: Install Chromium for browser regression
        run: npx playwright install chromium
      - name: D&D 2014 four-page editing, autosave and mobile paper geometry
        run: node tests/dnd5e-classic2014-browser.mjs
      - name: D&D 2024 four-page paper and 2014/2024 roundtrip in Chromium
        run: node tests/dnd5e-classic2024-browser.mjs
      - name: D&D advanced grimoire and resource autosave in Chromium
        run: node tests/dnd5e-advanced-browser.mjs
      - name: Download and validate 2014/2024 long-text A4 PDFs in Chromium
        run: node tests/dnd5e-final-pdf-browser.mjs
      - name: D&D two-device conflict, local draft and retry in Chromium
        run: node tests/dnd5e-final-conflict-browser.mjs
      - name: Verify downloadable PDFs in Chromium
        run: npm run test:pdf-browser
      - name: Check alternative Pathfinder layouts at desktop and mobile resolutions
        run: npm run test:pf-alternative-browser
      - name: Upload alternative Pathfinder screenshot snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-alt-visual-qa
          path: test-artifacts/pf-alt-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify library navigation in Chromium
        run: |
          npm run test:spell-library-browser
          node tests/routes-static-browser.mjs
      - name: Verify light/dark typography and layout parity on desktop and mobile
        run: node tests/theme-layout-browser.mjs
      - name: "Stage 2: small-screen forms, global errors, long titles and modal keyboard UX"
        run: node tests/stage2-ux-browser.mjs
      - name: "Stage 2: autosave serialization, offline errors, retry and stale drafts"
        run: node tests/stage2-save-browser.mjs
      - name: "Stage 2: reopen PF2e/Project Moon after saving hidden pages and equipment"
        run: node tests/stage2-sheet-reopen-browser.mjs
      - name: "Stage 2 bundle 5: verify paper grids and bounded mobile panning in Chromium"
        run: node tests/stage2-mobile-paper-browser.mjs
      - name: Rooms V2 player and tablet geometry in Chromium
        run: node tests/stage4-rooms-player-browser.mjs
      - name: "Release smoke: Project Moon mobile, autosave and export entrypoints"
        run: node tests/release-smoke-browser.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  rpc-quota-postgres:
    name: Isolated PostgreSQL RPC quota integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ays_rpc_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ays_rpc_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: ays_rpc_fixture
      PGUSER: postgres
      PGPASSWORD: local-fixture-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Provision synthetic room schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/room-rpc-local-schema.sql
      - name: Apply staging-only quota proposal in isolated Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/room-rpc-quotas-staging.sql
      - name: Verify real SQL RPC grants and quota semantics
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/room-rpc-local-assertions.sql
      - name: Verify concurrent requests cannot bypass SQL quota
        run: node tests/room-rpc-concurrency.mjs
      - name: Verify real two-user RLS permissions in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/rooms-v2-rls-final.sql
      - name: Verify isolated two-account D&D RLS, CAS and jsonb limits
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/dnd5e-final-local-rls.sql
      - name: Prepare disposable D&D Rooms V2 migration baseline
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/dnd-rooms-v2-baseline.sql
      - name: Apply proposed D&D Rooms SQL ONLY to ephemeral CI PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/dnd-rooms-v2-approval-required.sql
      - name: Verify two-account D&D Rooms RLS, safe snapshots, cross-system and quota
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/dnd-rooms-v2-rls.sql

  recovery-windows-smoke:
    name: Windows 11-compatible recovery safety smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify operator archive and Windows filesystem guards
        run: node tests/local-recovery-safety.mjs
      - name: Verify recovery report is syntactically valid
        run: node --check scripts/recovery-acceptance-report.mjs

  local-supabase-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Start a disconnected local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ays-isolated-supabase
          cd /tmp/ays-isolated-supabase
          npx --yes supabase@2.122.0 init
          npx --yes supabase@2.122.0 start -x studio,imgproxy,logflare,vector,edge-runtime,postgres-meta,supavisor
          npx --yes supabase@2.122.0 status -o env > "$GITHUB_WORKSPACE/.local-supabase-status"
      - name: Prepare temporary schema and approval-only proposal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tests/fixtures/room-rpc-local-schema.sql').read_text()
          for needle in ('CREATE ROLE anon NOLOGIN;','CREATE ROLE authenticated NOLOGIN;','CREATE SCHEMA auth;'):
              assert needle in src, needle
              src=src.replace(needle,'')
          begin=src.index('CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid')
          end=src.index('CREATE SCHEMA ays_rooms_private;',begin)
          src=src[:begin]+src[end:]
          Path('/tmp/ays-auth-baseline.sql').write_text(src)
          PY
          export PGPASSWORD=postgres
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ays-auth-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/room-rpc-quotas-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/dnd-rooms-v2-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/dnd-rooms-v2-approval-required.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE public.game_room_members REPLICA IDENTITY FULL;
          ALTER PUBLICATION supabase_realtime ADD TABLE public.game_room_members;
          INSERT INTO storage.buckets (id,name,public) VALUES ('ays-disposable-restore','ays-disposable-restore',false);
          CREATE POLICY ays_test_storage_insert ON storage.objects
            FOR INSERT TO authenticated WITH CHECK (
              bucket_id='ays-disposable-restore'
              AND (storage.foldername(name))[1]=(select auth.uid())::text);
          CREATE POLICY ays_test_storage_select ON storage.objects
            FOR SELECT TO authenticated USING (
              bucket_id='ays-disposable-restore'
              AND (storage.foldername(name))[1]=(select auth.uid())::text);
          CREATE POLICY ays_test_storage_delete ON storage.objects
            FOR DELETE TO authenticated USING (
              bucket_id='ays-disposable-restore'
              AND (storage.foldername(name))[1]=(select auth.uid())::text);
          SQL
      - name: Run two genuine local Auth JWT sessions, RLS/RPC, Realtime, races and fixture recovery
        shell: bash
        run: |
          node tests/dnd-rooms-v2-auth-e2e.mjs
          node tests/dnd-rooms-v2-local-recovery.mjs
      - name: Stop disposable stack and erase local credentials
        if: always()
        shell: bash
        run: |
          rm -f .local-supabase-status
          if [[ -d /tmp/ays-isolated-supabase ]]; then
            cd /tmp/ays-isolated-supabase
            npx --yes supabase@2.122.0 stop --no-backup || true
          fi

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, rpc-quota-postgres, recovery-windows-smoke]
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Rooms release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          origin = os.environ['PAGES_URL'].rstrip('/')
          expected = os.environ['GITHUB_SHA'][:12]
          for attempt in range(18):
              try:
                  def read(path):
                      url = origin + path + '?release=' + expected + '&check=' + str(attempt)
                      request = urllib.request.Request(url, headers={
                          'Cache-Control': 'no-cache',
                          'Pragma': 'no-cache',
                      })
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read().decode('utf-8')
                  release = json.loads(read('/release.json'))
                  page = read('/rooms/')
                  if release.get('revision') != expected:
                      raise ValueError('Stale release.json: ' + str(release))
                  marker = '<meta name="ays-build-revision" content="' + expected + '">'
                  if marker not in page:
                      raise ValueError('Rooms HTML still serves a previous build')
                  print('PASS: published Rooms revision', expected, 'at', origin + '/rooms/')
                  break
              except Exception as error:
                  if attempt == 17:
                      raise
                  print(f'Rooms release not propagated ({error}); retry {attempt+1}/18')
                  time.sleep(8)
          PY
      - name: Verify live Necromancer catalog
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          origin=os.environ['PAGES_URL'].rstrip('/')
          url=origin+'/spell-library/pf2e-necromancer.json'
          required={'create-thrall','thrall-charge','life-tap','bone-spear','dead-weight',
                    'muscle-barrier','necrotic-bomb','blood-infusion','song-of-the-soul','deathly-scream'}
          for attempt in range(12):
              try:
                  request=urllib.request.Request(url+'?verify='+os.environ['GITHUB_SHA'][:12],
                                                headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=15) as response:
                      catalog=json.load(response)
                  entries=catalog['spells']
                  found={spell['slug'] for spell in entries}
                  if len(entries)!=10 or found!=required:
                      raise ValueError(f'Expected ten Necromancer spells, got {len(entries)}: {found}')
                  if any('necromancer' not in entry['classes'] for entry in entries):
                      raise ValueError('Necromancer class tag missing')
                  print('PASS: GitHub Pages serves 10 Necromancer spells from',url)
                  break
              except Exception as error:
                  if attempt==11:
                      raise
                  print(f'Live catalog not ready ({error}); retry {attempt+1}/12')
                  time.sleep(4)
          PY
